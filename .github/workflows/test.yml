name: test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Run unit tests
        run: node cpm-engine.test.js

      # v2.10.18 — the client-name scanner runs on every push, not only in the
      # local aggregate suite (third-party audit, 20 Nov 2026). It is a
      # heuristic gate (hashed denylist plus shape rules), so a release also
      # needs the human publication review in CLAUDE.md section 3.
      - name: Client-name scanner
        run: node tests/no-client-names.test.js

      - name: Engine version sanity check
        shell: bash
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          ENGINE_VER=$(node -p "require('./cpm-engine.js').ENGINE_VERSION")
          echo "package.json version: $PKG_VER"
          echo "ENGINE_VERSION:       $ENGINE_VER"
          if [ "$PKG_VER" != "$ENGINE_VER" ]; then
            echo "::error::Version skew detected. package.json=$PKG_VER engine=$ENGINE_VER"
            exit 1
          fi

      - name: Run examples (sanity)
        shell: bash
        run: |
          for f in examples/*.js; do
            echo "=== $f ==="
            node "$f"
          done
